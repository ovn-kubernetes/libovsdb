name: libovsdb-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v5

      - name: Generate Code
        run: make prebuild

      - name: Check generated files are up to date
        run: make check-generated

      # This cannot be run in parallel because we require running go-generate first
      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test
        run: make integration-test

      - name: Generate coverage
        run: make coverage

      - name: Upload test coverage
        uses: shogo82148/actions-goveralls@v1
        continue-on-error: true
        with:
          path-to-profile: profile.cov

      - name: Benchmark
        run: make bench

      - name: Restore Latest Main Benchmark
        id: old-benchmark
        uses: actions/cache@v6
        with:
          path: bench-main.out
          key: benchmark-main-${{ hashfiles('**/*.go') }}
          restore-keys: |
            benchmark-main-

      - name: Compare Benchmarks
        if: hashFiles('bench-main.out') != ''
        run: benchstat bench-main.out bench.out

      - name: Create New Main Benchmark On Cache Miss
        if: steps.old-benchmark.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        run: cp -f bench.out bench-main.out

  cross-compile:
    name: Compile & Test (linux/${{ matrix.architecture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: 386
            goarch: 386
            qemu: ""
          - architecture: arm
            goarch: arm
            qemu: qemu-arm
          - architecture: mips
            goarch: mips
            qemu: qemu-mips
          - architecture: mipsle
            goarch: mipsle
            qemu: qemu-mipsel
          - architecture: aarch64
            goarch: arm64
            qemu: qemu-aarch64

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v5

      - name: Install QEMU
        if: matrix.qemu != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user

      - name: Generate Code
        run: make prebuild

      - name: Compile
        run: go build -v ./...
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}

      - name: Test
        run: |
          if [ -n "$QEMU" ]; then
            go test -short -timeout 10m -exec "$QEMU" ./...
          else
            go test -short -timeout 10m ./...
          fi
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          QEMU: ${{ matrix.qemu }}

  images:
    name: Tool Images
    needs: [build, test]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/tool-images.yml
    with:
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ovn-kubernetes/libovsdb' }}

  test:
    name: Integration Test
    needs: build
    strategy:
      matrix:
        ovs_version:
          - 3.7.1
          - 3.6.3
          - 3.5.4

    runs-on: ubuntu-latest

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v5

      - name: Integration Test
        run: make integration-test
        env:
          OVS_VERSION: ${{ matrix.ovs_version }}
