receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
  prometheus:
    config:
      scrape_configs:
        - job_name: stress
          scrape_interval: 1s
          static_configs:
            - targets: ["stress:2222"]
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  zipkin:
    endpoint: http://zipkin:9411/api/v2/spans
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
processors:
  batch: {}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [zipkin, otlphttp/jaeger]
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [prometheus]
